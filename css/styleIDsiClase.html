<!DOCTYPE html>
<html>
    <head>
        <title>id</title>
        <style>
            #Exemplu, #bar
            {
                color: blue;
            }
            .baz
            {
                color:orange;
            }
        </style>
        <!--Id-ul este unic(poate doar un h1 sa il aiba) si clasa e evident ca poate sa fie atribuita mai multor elem-->
    </head>
    <body>
        <h1 id = "Exemplu">salut</h1>
        <h1 id = "bar">serus</h1>
        <h1 class = "baz">servus</h1>
        <h1 class = baz">sal</h1>
        <h1>salll</h1>
    </body>
</html>

<!--Cum se aplica stilurile pe cod, adica de exemplu daca eu am pe un cod un stil in <h1 style:...> dupa am si un cod pe id-->
<!--dupa stil si pe clasa si am stil si pe type adica h1 in head ca si struct-->
<!--Prima data cel mai important e ala din h1 style dupa e ala pe id, clasa si ultimu e pe tip (adica daca fac struct la h1)-->
