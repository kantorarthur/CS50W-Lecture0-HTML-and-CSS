<!DOCTYPE HTML>
<html>
    <head>
        <title>tabele</title>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Ocean</th>
                    <th>Adancime maxima</th>
                    <th>Adancime medie</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Oceanu pacific</td>
                    <td>10000m</td>
                    <td>4000m</td>
                    <td>nigg</td>
                </tr>
                <tr>
                    <td>Oceanu atlantic</td>
                    <td>8523m</td>
                    <td>7400m</td>
                </tr>
            </tbody>
        </table>
        <!--Deci prima data am declarat un tabel, dupa am declarat capul tabelului cu thead-->
        <!--<tr> inseamna ca incepe linie noua, cand scrie <th> la date o sa fie ca si capu tabelului si o sa fie mai ingrosate-->
        <!--si cand scrie cu <td> inseamna table data si sunt scrise normal-->
    </body>
</html>
